<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CineFlow AI</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0907; color: #efe6d2; font-family: Georgia, serif; }
      main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; }
      h1 { font-weight: 400; font-size: 34px; margin: 0; }
      p { font-family: system-ui, sans-serif; font-size: 14px; color: #b3a68e; margin: 0; }
      button { margin-top: 12px; border: 0; border-radius: 6px; padding: 10px 18px; background: #f0a540; color: #1a140d; font: 600 14px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <!-- Shown only if the app can't reach the internet. -->
    <main>
      <h1>CineFlow AI</h1>
      <p>You're offline. Connect to the internet to make your films.</p>
      <button onclick="location.href='https://prompt-powered-photo-films.lovable.app'">Try again</button>
    </main>
  </body>
</html>
